<!DOCTYPE html>
<html>
<head>
    <title>**Central Ohio Duplex Zoning**</title>
    <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/pmtiles@2.11.0/dist/index.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }

        /* --- WATERMARK STYLING --- */
        .watermark {
            position: absolute;
            bottom: 20px; /* Distance from bottom */
            left: 20px;   /* Distance from left */
            z-index: 1000; /* Ensures it stays above the map */
            opacity: 0.5;  /* Transparency (0.1 to 1.0) */
            pointer-events: none; /* Allows user to click "through" it to the map */
        }

        .watermark img {
            width: 150px; /* Adjust size as needed */
            height: auto;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="watermark">
        <img src="watermark.png" alt="Logo">
    </div>

    <script>
        // Tell MapLibre how to handle the pmtiles:// protocol
        let protocol = new pmtiles.Protocol();
        maplibregl.addProtocol("pmtiles", protocol.tile);

        // Your hosted file URL
        const PMTILES_URL = "duplex_map.pmtiles";

        const map = new maplibregl.Map({
            container: 'map',
            zoom: 10,
            center: [-83.00, 39.96],
            style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json'
        });

        map.on('load', () => {
            map.addSource('my-pmtiles-source', {
                type: "vector",
                url: "pmtiles://" + PMTILES_URL
            });

            map.addLayer({
                "id": "my-duplexes",
                "type": "fill",
                "source": "my-pmtiles-source",
                "source-layer": "zoning_layer",
                "paint": {
                    "fill-color": [
                        "match",
                        ["get", "Duplex"],
                        "Yes", "#22c55e",
                        "No", "#ef4444",
                        "#d1d5db"
                    ],
                    "fill-opacity": 0.8
                }
            });

            map.on('click', 'my-duplexes', (e) => {
                const clickedShape = e.features[0];
                const properties = clickedShape.properties;
                const coordinates = e.lngLat;

                let popupContent = "<h3>Parcel Information</h3>";
                for (const key in properties) {
                    popupContent += `<strong>${key}:</strong> ${properties[key]}<br>`;
                }

                new maplibregl.Popup()
                    .setLngLat(coordinates)
                    .setHTML(popupContent)
                    .addTo(map);
            });

            map.on('mouseenter', 'my-duplexes', () => {
                map.getCanvas().style.cursor = 'pointer';
            });

            map.on('mouseleave', 'my-duplexes', () => {
                map.getCanvas().style.cursor = '';
            });
        });
    </script>
</body>
</html>
