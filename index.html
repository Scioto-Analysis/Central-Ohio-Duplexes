<script>
    // 1. Setup PMTiles Protocol
    let protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    // 2. CHANGE THIS: Paste your Release Link inside these quotes
    const PMTILES_URL = "https://github.com/scioto-analysis/Central-Ohio-Duplexes/releases/download/v1.0/duplex_map.pmtiles";

    const map = new maplibregl.Map({
        container: 'map',
        style: {
            version: 8,
            sources: {
                'zoning-source': {
                    type: 'vector',
                    url: `pmtiles://${PMTILES_URL}`,
                    attribution: 'Scioto Analysis'
                }
            },
            layers: [
                {
                    'id': 'background',
                    'type': 'background',
                    'paint': { 'background-color': '#ff0000' } // RED TEST
                },
                {
                    'id': 'zoning-polygons',
                    'source': 'zoning-source',
                    'source-layer': 'zoning_layer',
                    'type': 'fill',
                    'paint': {
                        'fill-color': '#2c7fb8',
                        'fill-opacity': 0.5
                    }
                }
            ]
        },
        center: [-82.9988, 39.9612],
        zoom: 9
    });
</script>
