<!DOCTYPE html>
<html>
<head>
    <title>Central Ohio Zoning Map</title>
    <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/pmtiles@2.x/dist/index.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Setup PMTiles Protocol
        let protocol = new pmtiles.Protocol();
        maplibregl.addProtocol("pmtiles", protocol.tile);

        const PMTILES_URL = "https://github.com/Scioto-Analysis/Central-Ohio-Duplexes/releases/download/v1.0/duplex_map.pmtiles";

        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {
                    'zoning-source': {
                        type: 'vector',
                        url: `pmtiles://${PMTILES_URL}`,
                        attribution: 'Scioto Analysis'
                    }
                },
                layers: [
                    {
                        'id': 'background',
                        'type': 'background',
                        'paint': { 'background-color': '#f0f0f0' }
                    },
                    {
                        'id': 'zoning-polygons',
                        'source': 'zoning-source',
                        'source-layer': 'base_lyr_FeaturesToJSON',
                        'type': 'fill',
                        'paint': {
                            'fill-color': '#2c7fb8',
                            'fill-opacity': 0.5,
                            'fill-outline-color': '#ffffff'
                        }
                    }
                ]
            },
            center: [-82.9988, 39.9612], // Columbus
            zoom: 9
        });

        // Add zoom controls
        map.addControl(new maplibregl.NavigationControl());
    </script>
</body>
</html>
